[package]
name = "qr-tool"
version = "1.1.1"
description = "完全离线的二维码识别小工具"
edition = "2021"

[lib]
name = "qr_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
screenshots = "0.8"
image = { version = "0.24", default-features = false, features = ["png"] }
base64 = "0.22"

[profile.release]
strip = true
lto = true
codegen-units = 1
