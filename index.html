<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'><defs><linearGradient id='s' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23F7F9FC'/><stop offset='.45' stop-color='%23C9CFDA'/><stop offset='.7' stop-color='%23EDEFF4'/><stop offset='1' stop-color='%23A7AFBD'/></linearGradient><linearGradient id='d' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='%231E222B'/><stop offset='1' stop-color='%230B0C0F'/></linearGradient></defs><rect width='128' height='128' rx='29' fill='url(%23d)'/><g fill='none' stroke='url(%23s)' stroke-width='7'><rect x='22' y='22' width='32' height='32' rx='9'/><rect x='74' y='22' width='32' height='32' rx='9'/><rect x='22' y='74' width='32' height='32' rx='9'/></g><g fill='%23FFFFFF'><rect x='32' y='32' width='12' height='12' rx='3.5'/><rect x='84' y='32' width='12' height='12' rx='3.5'/><rect x='32' y='84' width='12' height='12' rx='3.5'/></g><rect x='80' y='80' width='10' height='10' rx='3' fill='%238B93A3'/><rect x='96' y='80' width='10' height='10' rx='3' fill='%234A5060'/><rect x='80' y='96' width='10' height='10' rx='3' fill='%234A5060'/><rect x='96' y='96' width='10' height='10' rx='3' fill='%23333947'/></svg>" />
    <title>极简二维码</title>
    <style>
      /* 遮罩窗口关键样式内联:在任何 JS/CSS 加载前生效,杜绝无样式闪烁 */
      html.overlay-mode { background: #000; }
      html.overlay-mode .app { display: none; }
    </style>
    <script>
      // 遮罩窗口(region-overlay-*):首帧前隐藏应用 UI,遮罩窗内只应存在选区层
      (function () {
        try {
          var label = window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.metadata && window.__TAURI_INTERNALS__.metadata.currentWindow ? window.__TAURI_INTERNALS__.metadata.currentWindow.label : ''
          if (/^region-overlay-\d+$/.test(label) || new URLSearchParams(window.location.search).has('overlay')) {
            document.documentElement.classList.add('overlay-mode')
          }
        } catch (e) { /* 非桌面环境忽略 */ }
        // 配色主题:首帧前应用持久化主题,避免闪换
        try {
          var t = localStorage.getItem('qr.theme.v1')
          document.documentElement.dataset.theme = t === 'black-yellow' ? 'black-yellow' : 'black-green'
        } catch (e2) { /* 存储不可用则走 CSS 默认 */ }
      })()
    </script>
  </head>
  <body>
    <div class="app" id="app">
      <header class="header">
        <h1>极简二维码</h1>
        <div class="header-right">
          <button id="theme-toggle" class="theme-toggle" type="button" title="切换配色(黑绿 / 黑黄)">配色 绿</button>
          <span class="subtitle">离线 · 本地运行</span>
        </div>
      </header>

      <!-- 识别面板 -->
      <div id="panel-scan" class="panel" data-testid="panel-scan">
        <div class="toolbar-row">
          <section id="dropzone" class="toolbar" data-testid="dropzone">
            <button id="pick-button" class="primary" data-testid="pick-button">选择图片</button>
            <button id="region-button" class="primary" data-testid="region-button" hidden>屏幕选区</button>
            <span class="toolbar-hint">拖拽 / Ctrl+V 粘贴 / 全局 Alt+Q 屏幕选区</span>
            <input id="file-input" type="file" accept="image/*" multiple hidden />
          </section>
          <button id="clear-button" class="clear-button" data-testid="clear-button" hidden>清空</button>
        </div>

        <p id="progress" class="progress" data-testid="progress" hidden></p>

        <main class="content">
          <section id="results" class="results" data-testid="results"></section>
          <div id="empty-hint" class="empty" data-testid="empty-hint">
            <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
              <rect x="3" y="3" width="7" height="7" rx="1.5" />
              <rect x="14" y="3" width="7" height="7" rx="1.5" />
              <rect x="3" y="14" width="7" height="7" rx="1.5" />
              <path d="M14 14h3.5v3.5H14zM18.5 18.5H21V21h-2.5z" fill="currentColor" stroke="none" />
              <path d="M18.5 14H21v2.5M14 18.5h2.5V21" stroke-linecap="round" />
            </svg>
            <p class="empty-title">识别结果会显示在这里</p>
            <p class="empty-sub">粘贴、拖拽或选择含二维码的图片</p>
          </div>
        </main>
      </div>

    </div>

    <div id="toast" class="toast" data-testid="toast" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
