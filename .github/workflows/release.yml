# Release:双产品线 tag 触发自动构建三平台产物并创建 GitHub Release。
# - v*          → 全功能线  OfflineQR(recognition-generation 分支)
# - scanner-v*  → 仅识别线  OfflineQRScanner(recognition 分支)
# - Windows: NSIS 安装包 + 绿色版 zip
# - Linux:   AppImage / deb
# - macOS:   dmg (Apple Silicon;如需 Intel 可在 matrix 中追加 --target x86_64-apple-darwin)
# 注意:tag 中携带的版本必须与该提交 src-tauri/tauri.conf.json 的 version 一致(工作流内有守卫);
#       测试不在此工作流——CI(push/PR)按分支跑各自用例集,发版前额外执行一次单测兜底。
# 本地代理(HTTPS_PROXY)仅本机开发需要;CI 到 GitHub 网络畅通,无需代理。
name: Release

on:
  push:
    tags: ['v*', 'scanner-v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies (webkit2gtk 等)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install npm dependencies
        run: npm ci

      - name: Resolve product from tag prefix
        id: meta
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" == scanner-v* ]]; then
            echo "version=${TAG#scanner-v}"   >> "$GITHUB_OUTPUT"
            echo "release_name=OfflineQRScanner $TAG" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == v* ]]; then
            echo "version=${TAG#v}"           >> "$GITHUB_OUTPUT"
            echo "release_name=OfflineQR $TAG" >> "$GITHUB_OUTPUT"
          else
            echo "::error::不支持的 tag 格式:$TAG(应为 v* 或 scanner-v*)"
            exit 1
          fi

      - name: Check tag matches app version
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$VERSION" != "${{ steps.meta.outputs.version }}" ]; then
            echo "::error::tag ${{ github.ref_name }} 与 tauri.conf.json version v$VERSION 不一致"
            exit 1
          fi

      - name: Run unit tests
        run: npm test

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ steps.meta.outputs.release_name }}
          releaseBody: '完全离线的二维码工具。见 Assets 下载对应平台安装包。'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build portable zip (Windows 免安装版)
        if: matrix.platform == 'windows-latest'
        run: node scripts/make-portable.mjs

      - name: Upload portable zip to release
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" src-tauri/target/release/bundle/portable/*_portable_x64.zip --clobber

      - name: Collect failed-step logs
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run view "${{ github.run_id }}" --log-failed > failed-steps.log 2>&1 || true

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs-${{ matrix.platform }}
          path: failed-steps.log
          retention-days: 14
          if-no-files-found: ignore
